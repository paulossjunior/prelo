# Trava remota (T029, FR-011): a suíte completa e a auditoria em macOS, Windows e Linux.
# Os checks "verify (<sistema>)" são obrigatórios na proteção da main (FR-012).
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential libssl-dev libxdo-dev webkit2gtk-driver xvfb

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Ferramentas de auditoria e WebDriver
        shell: bash
        run: |
          cargo install cargo-deny --locked
          if [ "$RUNNER_OS" != "macOS" ]; then cargo install tauri-driver --locked; fi

      - run: npm ci

      - name: npm run verify (Linux, tela virtual)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run verify

      - name: npm run verify
        if: runner.os != 'Linux'
        run: npm run verify
