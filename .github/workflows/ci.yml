# Trava remota (T029, FR-011): a suíte completa e a auditoria.
# Os checks "verify (<sistema>)" são obrigatórios na proteção da main (3 sistemas) e da dev (macOS).
name: CI

# Gitflow: feature/* → dev → main. Roda em PR e push para dev e main.
# workflow_call: o release.yml (spec 002) reaproveita este verify antes do build.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Para a dev: só macOS (rápido). Para a main, tag e release: os 3 sistemas.
        # Os nomes "verify (<sistema>)" são os checks exigidos pela proteção de cada branch.
        os: ${{ fromJSON((github.base_ref == 'dev' || github.ref == 'refs/heads/dev') && '["macos-latest"]' || '["ubuntu-22.04","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential libssl-dev libxdo-dev webkit2gtk-driver xvfb dbus-x11

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Ferramentas de auditoria e WebDriver
        shell: bash
        run: |
          cargo install cargo-deny --locked
          if [ "$RUNNER_OS" != "macOS" ]; then cargo install tauri-driver --locked; fi

      - name: msedgedriver da mesma versão do WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $ver = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          if (-not $ver) {
            $ver = (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          }
          Write-Host "WebView2 $ver"
          $dir = Join-Path $env:RUNNER_TEMP "msedgedriver"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $dir "edgedriver.zip"
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip" -OutFile $zip
          } catch {
            Invoke-WebRequest "https://msedgedriver.azureedge.net/$ver/edgedriver_win64.zip" -OutFile $zip
          }
          Expand-Archive $zip -DestinationPath $dir -Force
          "EDGEWEBDRIVER=$dir" >> $env:GITHUB_ENV
          # Wrapper com log detalhado do msedgedriver (diagnóstico do WebDriver no Windows).
          $log = Join-Path $env:RUNNER_TEMP "msedgedriver.log"
          $wrapper = Join-Path $dir "msedgedriver-verbose.cmd"
          Set-Content $wrapper -Encoding ascii -Value "@echo off`r`n`"$dir\msedgedriver.exe`" %* --verbose --log-path=`"$log`""
          "PRELO_NATIVE_DRIVER=$wrapper" >> $env:GITHUB_ENV
          "PRELO_NATIVE_DRIVER_LOG=$log" >> $env:GITHUB_ENV

      - run: npm ci

      - name: npm run verify (Linux, tela virtual)
        if: runner.os == 'Linux'
        env:
          # WebKitGTK sob xvfb pode não renderizar com o renderizador DMABUF.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: dbus-run-session -- xvfb-run --auto-servernum npm run verify

      - name: npm run verify
        if: runner.os != 'Linux'
        run: npm run verify

      - name: Diagnóstico do WebView2 (Windows, em falha)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          # O WebView2 aceita a porta de depuração pela variável de ambiente mesmo com os
          # argumentos que o Tauri passa? Onde ele grava o DevToolsActivePort?
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=0"
          $app = Start-Process "src-tauri\target\debug\prelo.exe" -PassThru
          Start-Sleep -Seconds 15
          Write-Host "== processos msedgewebview2"
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" |
            Select-Object ProcessId, CommandLine | Format-List | Out-String -Width 4000
          Write-Host "== pasta de dados do app"
          Get-ChildItem -Recurse -Depth 2 "$env:LOCALAPPDATA\org.prelo.app" -ErrorAction SilentlyContinue |
            Select-Object FullName | Out-String -Width 400
          Write-Host "== DevToolsActivePort"
          Get-ChildItem -Recurse -Filter DevToolsActivePort -ErrorAction SilentlyContinue `
            -Path $env:LOCALAPPDATA, $env:TEMP, "src-tauri\target\debug" |
            ForEach-Object { $_.FullName; Get-Content $_.FullName }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue

      - name: Log do msedgedriver (Windows, em falha)
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: msedgedriver-log
          path: ${{ runner.temp }}/msedgedriver.log
          if-no-files-found: ignore

  # Desempenho da prévia (T075; SC-001, SC-002): p95 edição → SVG pronto na fixture de 40
  # páginas, com e sem imagens grandes, em build de release (src-tauri/tests/perf_preview.rs,
  # feature `perf`). Limite de 250 ms como guarda de regressão; a meta de 100 ms vale no
  # computador de referência (research.md, "Medições de desempenho").
  # Fora da release (tag): o commit da tag já passou por este job no PR para a main, e uma
  # oscilação de tempo num runner compartilhado não deve barrar a publicação.
  perf:
    name: perf (${{ matrix.os }})
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential libssl-dev libxdo-dev

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: perf

      - name: Teste de desempenho (release)
        env:
          PRELO_PERF_LIMIT_MS: "250"
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --features perf --test perf_preview -- --nocapture --test-threads=1

  # Equivalência com o `typst` de linha de comando (T070; FR-031, SC-005): o PDF do Prelo e o do
  # `typst` 0.15.1, com o mesmo conjunto de fontes, renderizados e comparados página a página
  # (src-tauri/tests/equivalence.rs, feature `equivalence`). O `typst` é instalado só neste job,
  # do release oficial com SHA-256 fixado; o job `verify` e o app continuam sem `typst` (FR-010).
  equivalence:
    name: equivalence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: typst-x86_64-unknown-linux-musl.tar.xz
            sha256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
          - os: windows-latest
            asset: typst-x86_64-pc-windows-msvc.zip
            sha256: 19ce3551153c2fe7ee9fa2f95208310c8f4d3209fedb699e0333faf8913f6736
          - os: macos-latest
            asset: typst-aarch64-apple-darwin.tar.xz
            sha256: 48f62ed034aa3a7978309579ac6ca00045e2ef0da73114e8af27cfd8e74dc05a
    env:
      TYPST_VERSION: "0.15.1"
    steps:
      - uses: actions/checkout@v5

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential libssl-dev libxdo-dev

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: equivalence

      - name: typst ${{ env.TYPST_VERSION }} (só neste job)
        shell: bash
        run: |
          dir="$RUNNER_TEMP/typst"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/${{ matrix.asset }}" \
            "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/${{ matrix.asset }}"
          if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          echo "${{ matrix.sha256 }}  $dir/${{ matrix.asset }}" | $sum -c -
          case "${{ matrix.asset }}" in
            *.zip) unzip -q "$dir/${{ matrix.asset }}" -d "$dir" ;;
            *) tar -xJf "$dir/${{ matrix.asset }}" -C "$dir" ;;
          esac
          bin="$(find "$dir" -type f \( -name typst -o -name typst.exe \) | head -n 1)"
          test -n "$bin"
          "$bin" --version
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$(cygpath -w "$bin")"; fi
          echo "PRELO_TYPST_CLI=$bin" >> "$GITHUB_ENV"

      - name: Teste de equivalência
        env:
          PRELO_EQUIVALENCE_REQUIRED: "1"
          PRELO_EQUIVALENCE_OUT: ${{ runner.temp }}/equivalence
        run: cargo test --manifest-path src-tauri/Cargo.toml --features equivalence --test equivalence -- --nocapture

      - name: PDFs que diferem (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-${{ matrix.os }}
          path: ${{ runner.temp }}/equivalence
          if-no-files-found: ignore
