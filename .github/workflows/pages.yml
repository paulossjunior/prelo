# Publica site/ (HTML estático, sem build) no GitHub Pages pelo método oficial.
# Requer Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

# Sem permissões no topo: o único job declara só o que precisa.
permissions: {}

# Uma publicação por vez; a que está em andamento termina antes da próxima.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
