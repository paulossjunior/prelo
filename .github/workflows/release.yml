# Pipeline de release (spec 002, contracts/release-workflow.md): tag vX.Y.Z na main →
# instaladores em rascunho no GitHub Releases. Ordem: preflight → verify → build → publish.
name: Release

# O filtro de tag do GitHub não é regex completa; o preflight repete a checagem estrita.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Sem permissões no topo: cada job declara só o que precisa (FR-011).
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Falha em segundos, antes de verify e build (FR-001–FR-003, FR-016).
  preflight:
    name: preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Histórico completo: a ancestralidade é conferida contra origin/main.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Tag, main, versões e licença
        run: node scripts/release-check.mjs "$TAG"

  # O mesmo verify da spec 001 nos três sistemas (FR-004). O topo é permissions: {} e o
  # workflow chamado só pode reduzir permissões, então a leitura é declarada aqui.
  verify:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Instaladores sem publicar: só leitura (research R4). Nenhuma feature extra é ligada.
  build:
    name: build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential libssl-dev libxdo-dev webkit2gtk-driver xvfb dbus-x11

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Alvos Apple (dmg universal)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Sem cache de build: o instalador sai de um estado limpo.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Gerar instaladores
        shell: bash
        run: npx --no-install tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Confere o artefato real: o comando de autoteste não pode estar no binário (FR-010).
      - name: Binário sem autoteste
        shell: bash
        run: |
          bin="src-tauri/target/${{ matrix.target }}/release/prelo"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          node scripts/release-artifacts.mjs scan "$bin"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  # Único job com escrita (FR-011). Só roda com todos os instaladores (FR-008).
  publish:
    name: publish
    needs: [preflight, verify, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      # Um diretório por sistema: nome repetido entre sistemas é acusado pelo collect.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          path: downloads

      - name: Conferir o conjunto de instaladores
        run: node scripts/release-artifacts.mjs collect downloads "${TAG#v}" release-files

      - name: Checksums (SHA256SUMS.txt)
        run: node scripts/release-artifacts.mjs sums release-files

      # TAG já passou pelo formato estrito vX.Y.Z no preflight: seguro no sed.
      - name: Notas do rascunho
        run: sed "s/{{VERSION}}/${TAG#v}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"

      - name: Release ainda não existe (FR-013)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release: a release $TAG já existe; nada foi alterado" >&2
            exit 1
          fi
          # Rascunhos aparecem na lista (o token tem escrita); nome ou tag iguais barram.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | .tag_name, .name' \
            > "$RUNNER_TEMP/releases.txt"
          if grep -Fxq -- "$TAG" "$RUNNER_TEMP/releases.txt"; then
            echo "release: já existe release ou rascunho $TAG; nada foi alterado" >&2
            exit 1
          fi

      # created=true antes do comando: se o upload falhar no meio, a limpeza ainda age.
      # A release não existia (passo anterior) e a concorrência por tag impede outra execução.
      - name: Criar rascunho
        id: create
        run: |
          echo "created=true" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" release-files/*

      - name: Conferir assets anexados
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/attached.txt"
          ls -1 release-files | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/attached.txt"

      - name: Apagar rascunho incompleto
        if: failure() && steps.create.outputs.created == 'true'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
