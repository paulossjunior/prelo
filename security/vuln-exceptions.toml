# Exceções de vulnerabilidade (FR-009). Formato: data-model.md "Exceção de vulnerabilidade".
# Cada exceção precisa de id, ecosystem ("cargo" ou "npm"), reason não vazio e review_by
# (data ISO). Passada a data, a auditoria falha até alguém revisar.
# Exceções "cargo" também precisam constar em src-tauri/deny.toml [advisories].ignore.
#
# [[exception]]
# id = "RUSTSEC-0000-0000"
# ecosystem = "cargo"
# reason = "sem correção publicada; caminho vulnerável não é usado pelo Prelo"
# review_by = "2027-01-31"

# quick-xml 0.38: tempo quadrático com nomes de atributo repetidos
[[exception]]
id = "RUSTSEC-2026-0194"
ecosystem = "cargo"
reason = "via typst-library 0.15.1 → hayagriva 0.10.1 → citationberg 0.7.0 (^0.38); sem versão corrigida compatível; mitigado por limite de tamanho do .csl (1 MiB) e limite de tempo da compilação (10 s). Aprovada pelo dono em 2026-11-19."
review_by = "2027-02-17"

