[package]
name = "prelo"
version = "0.1.0"
description = "Prelo: editor desktop colaborativo para artigos em Typst"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "prelo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Compilador embutido (D-10, research R1/R2). Versões exatas: atualizar só com a suíte verde.
typst = "=0.15.1"
typst-svg = "=0.15.1"
typst-pdf = "=0.15.1"
typst-ide = "=0.15.1"
# `PagedDocument` (saída de `typst::compile`) mora no `typst-layout`; já vinha na árvore pelo
# `typst`, mesma versão e licença (Apache-2.0).
typst-layout = "=0.15.1"
# Sem as features `system`, `fonts`, `http-registry`: leitura de disco, fontes e pacotes
# passam só pelo núcleo do Prelo (RF-08, D-15, research R7).
tinymist-world = { version = "=0.15.0", default-features = false }
tinymist-vfs = { version = "=0.15.0", default-features = false }
tinymist-package = { version = "=0.15.0", default-features = false }
# Sem tinymist-query nem typlite: a análise do editor usa o typst-ide oficial (D-17).
# Download de pacotes @preview: TLS com rustls (ring) e certificados do sistema lidos por
# rustls-native-certs, sem webpki-roots/webpki-root-certs (CDLA-Permissive-2.0, fora da
# lista; research R7, R12).
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
flate2 = "1.1"
tar = "0.4"
sha2 = "0.10"
tempfile = "3.27"
notify = "8"
dirs = "6"
tauri-plugin-dialog = "2"

# Regra de escopo de arquivo (fs/scope.rs, research R11): abertura com O_NONBLOCK/O_NOFOLLOW e
# caminho real do descritor (F_GETPATH no macOS; GetFinalPathNameByHandleW no Windows).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
tempfile = "3.27"
# Teste de equivalência (tests/equivalence.rs, FR-031): renderiza as páginas dos dois PDFs
# para comparar pixel a pixel. Só em teste; mesma versão e licença (Apache-2.0) do `typst`.
typst-render = "=0.15.1"

[features]
# Autoteste ponta a ponta (research R3). Nunca habilitado em release.
self-test = []
# Teste de equivalência com o `typst` de linha de comando (FR-031); só no job do CI.
equivalence = []
